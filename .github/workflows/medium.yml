name: Update Medium articles

on:
  schedule:
    - cron: "0 3 * * 1" # every Monday 03:00 UTC
  workflow_dispatch: # allow a manual run from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest articles
        run: python scripts/fetch_medium.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/medium.json; then
            echo "No new articles."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/medium.json
          git commit -m "Update Medium articles"
          git push
